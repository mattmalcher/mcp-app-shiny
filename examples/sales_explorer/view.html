<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sales explorer</title>
<style>
  :root { color-scheme: light; --accent: #2563eb; --muted: #6b7280; --line: #e5e7eb; }
  body { font: 14px/1.4 system-ui, sans-serif; margin: 12px; color: #111827; }
  .filters { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; margin-bottom: 12px; }
  label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 2px; }
  select { font: inherit; padding: 4px 6px; }
  .total { margin-left: auto; text-align: right; }
  .total strong { font-size: 20px; display: block; color: #111827; }
  .bars { display: grid; gap: 6px; margin-bottom: 12px; }
  .bar { display: grid; grid-template-columns: 70px 1fr 90px; align-items: center; gap: 8px;
         border: 1px solid transparent; border-radius: 6px; padding: 4px 6px; cursor: pointer;
         background: none; font: inherit; text-align: left; }
  .bar:hover { border-color: var(--line); }
  .bar[aria-pressed="true"] { border-color: var(--accent); background: #eff6ff; }
  .fill { height: 14px; background: var(--accent); border-radius: 3px; opacity: .8; }
  .amount { text-align: right; font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: left; }
  td.num, th.num { text-align: right; }
  .selection { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .selection p { margin: 0; flex: 1; color: var(--muted); }
  button.primary { background: var(--accent); color: white; border: 0; border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
  button.primary:disabled { opacity: .4; cursor: default; }
</style>
</head>
<body>
  <div class="filters">
    <label>Product <select id="product" aria-label="Product"></select></label>
    <label>Quarter <select id="quarter" aria-label="Quarter"></select></label>
    <div class="total">Revenue <strong id="total">…</strong></div>
  </div>
  <div class="bars" id="bars" role="group" aria-label="Revenue by region"></div>
  <table>
    <thead><tr><th>Product</th><th class="num">Units</th><th class="num">Revenue</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="selection">
    <p id="selection-status">Click a region to share it with the host.</p>
    <button class="primary" id="ask" disabled>Ask about this region</button>
  </div>
  <script>/*BUNDLE*/</script>
</body>
</html>
