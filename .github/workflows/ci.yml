name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REQUIRE_OFFICIAL: "1"  # official npm server tests must run here, not skip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Cache upstream ext-apps (basic-host)
        uses: actions/cache@v4
        with:
          path: build/ext-apps
          key: ext-apps-${{ hashFiles('scripts/setup_basic_host.sh') }}

      - name: Setup
        run: |
          make setup-dev setup-node
          .venv/bin/python -m playwright install --with-deps chromium

      - name: Bundled assets are up to date
        run: git diff --exit-code -- src/shiny_mcp_host/static

      - name: Vendored MCP Apps SDK matches the pinned upstream release
        run: .venv/bin/python scripts/vendor_app_sdk.py --check

      - run: make lint
      - run: make test-unit
      - run: make test-integration
      - run: make test-e2e
      - run: make test-security
      - run: make test-dist
      - run: make test-compat

      - name: Upload traces and logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/

  demo-server-bundle:
    # Packages the sales explorer as a self-contained MCP server folder (View
    # with the official SDK inlined) that runs without Node or shiny-mcp-host,
    # e.g. on Posit Connect. Needs only Python: the SDK ships in this repo.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Package the MCP server
        run: |
          make setup
          .venv/bin/python scripts/package_demo_server.py dist/sales-explorer-mcp-server

      - uses: actions/upload-artifact@v4
        with:
          name: sales-explorer-mcp-server
          path: dist/sales-explorer-mcp-server/
          if-no-files-found: error
